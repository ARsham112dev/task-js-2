<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Mini shop Product Detailes</title>
    <link rel="stylesheet" href="../style/product-details.css" />
    <script type="module" src="../scripts/product-details.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <h1>Mini<span>shop.</span></h1>
      </div>
      <div id="my-cart">
        <img src="../assets/svgs/files-by-google-svgrepo-com.svg" alt="logo" />
        <p>my cart</p>
        <div id="my-cart-number">0</div>
      </div>
    </header>
    <main>
      <section id="product">
        <section id="product-imgs"></section>
        <section id="product-details"></section>
      </section>
      <section id="tab-list">
        <nav class="tabs">
          <button class="overview-tab">Overview</button>
          <button class="reviews-tab">Reviews</button>
          <button class="specifications-tab">Specifications</button>
        </nav>
        <div class="tab-content"></div>
      </section>
    </main>
  </body>
</html>
